<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AQMS Display TV</title>

<link rel="stylesheet" href="css/display.css">

</head>

<body>

<div id="displayWrapper" class="display-wrapper idle-mode">

<div class="header">

    <div class="logo">
        🚰 AQMS
    </div>

    <div id="clock" class="clock">
        00:00:00
    </div>

</div>

<div class="content">

    <!-- Panel Nomor Antrian -->

    <div class="queue-panel">

        <div class="service">
            CUSTOMER SERVICE
        </div>

        <div class="label">
            NOMOR ANTRIAN
        </div>

        <div id="number" class="number">
            -
        </div>

        <div id="counter" class="counter">
            Counter -
        </div>

    </div>

    <!-- Panel Video -->

    <div class="video-panel">

        <div class="video-placeholder">

            <div id="videoContainer" class="video-container">

                <video
                    id="promoVideo"
                    autoplay
                    muted
                    playsinline
                ></video>            

                <img
                    id="promoImage"
                    style="display:none"
                >

            </div>

        </div>

    </div>
    

</div>

<div class="message">

    Silakan menuju counter yang dituju

</div>

<div class="footer">

    <div class="footer-left">

        <strong>AQMS v0.7.0</strong><br>

        Developed by <strong>Vicky</strong><br>

        Development assisted by <strong>ChatGPT (OpenAI)</strong>

    </div>

    <div class="footer-right">

        <div id="timeline" class="timeline"></div>

    </div>

</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="js/voice.js"></script>
<script src="js/display.js"></script>

</body>
</html>
