<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter Operator</title>

    <style>

        body{
            font-family: Arial, Helvetica, sans-serif;
            background:#f4f6f9;
            margin:0;
        }

        .container{
            width:800px;
            margin:30px auto;
            background:#fff;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,.15);
            overflow:hidden;
        }

        .header{

            background:linear-gradient(135deg,#0d6efd,#0a58ca);

            color:white;

            padding:30px;

            text-align:center;

        }

        .section{
            padding:20px;
        }

        .current-number{

            font-size:90px;

            font-weight:bold;

            color:#0d6efd;

            text-align:center;

            margin:15px 0;

            letter-spacing:4px;

        }

        @keyframes pulse{

            0%{
                transform:scale(1);
            }

            50%{
                transform:scale(1.05);
            }

            100%{
                transform:scale(1);
            }

        }

        .current-number{

            animation:pulse 2s infinite;

        }

        .service-time{

            width:240px;

            margin:25px auto;

            background:#eef5ff;

            border-radius:15px;

            padding:18px;

            box-shadow:0 4px 10px rgba(0,0,0,.08);

            text-align:center;

        }

        .service-label{

            color:#666;

            font-size:15px;

            margin-top:8px;

        }

        #serviceTimer{

            font-size:42px;

            font-weight:bold;

            color:#0d6efd;

            font-family:Consolas,monospace;

        }

        .waiting-list{

    display:grid;

    grid-template-columns:

        repeat(2,1fr);

    gap:12px;

    height:260px;

    overflow-y:auto;

    border:1px solid #ddd;

    border-radius:10px;

    padding:15px;

}

        .waiting-item{

    display:flex;

    align-items:center;

    justify-content:center;

    height:58px;

    background:#f7f9fc;

    border-radius:12px;

    font-size:26px;

    font-weight:bold;

    transition:.25s;

}

        .waiting-item:hover{

    transform:translateY(-2px);

    background:#eef5ff;

}

        .buttons{

            margin-top:25px;
            text-align:center;

        }

        button{

            padding:15px 28px;

            font-size:18px;

            border:none;

            border-radius:10px;

            cursor:pointer;

            transition:.25s;

            color:white;

        }

        button:hover{

            transform:translateY(-2px);

            box-shadow:0 6px 12px rgba(0,0,0,.18);

        }

        #btnCall{

            background:#198754;
            color:white;
            border:none;

        }

        #btnRecall{

            background:#ffc107;
            border:none;

        }

        #btnSkip{

            background:#d9d9d9;
            border:none;

        }

        #btnFinish{

            background:#dc3545;
            color:white;
            border:none;

        }

        .waiting-wrapper{

    margin-top:25px;

}

.waiting-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:15px;

}

.waiting-total{

    min-width:42px;

    height:42px;

    border-radius:50%;

    background:#fc8f8f;

    color:white;

    display:flex;

    align-items:center;

    justify-content:center;

    font-weight:bold;

    font-size:18px;

}

.waiting-item.next{

    background:

    linear-gradient(

    135deg,

    #feffdf,

    #fdffe8

    );

    color:rgb(34, 34, 34);

}

    </style>

</head>
<body>

<div class="container">

    <div class="header">

        <h1>🚰 PDAM Queue System</h1>

        <h2 id="counterTitle"></h2>

    </div>

    <div class="section">

        <h3>Sedang Dipanggil</h3>

        <div class="current-number" id="currentNumber">
            -
        </div>

        <div class="service-time">

        <div class="service-label">
            ⏱ Durasi Pelayanan
        </div>

        <div id="serviceTimer">
            00:00
        </div>

    </div>

        <hr>

        <div class="waiting-wrapper">

    <div class="waiting-header">

        <h3>Daftar Menunggu</h3>

        <div id="waitingTotal" class="waiting-total">

            0

        </div>

    </div>

    <div
        id="waitingList"
        class="waiting-list">

    </div>

</div>

        <div class="buttons">

            <button id="btnCall">
                ▶ Panggil Berikutnya
            </button>

            <button id="btnRecall">
                🔄 Panggil Ulang
            </button>

            <button id="btnSkip">
                ⏭ Skip
            </button>

            <button id="btnFinish">
                ✔ Selesai
            </button>

        </div>

    </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="js/counter.js"></script>

</body>
</html>
