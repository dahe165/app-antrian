<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AQMS Reporting</title>

<style>

body{

    margin:0;

    background:#eef2f7;

    font-family:Arial,Helvetica,sans-serif;

}

.header{

    background:#0d6efd;

    color:white;

    padding:20px;

}

.container{

    max-width:1200px;

    margin:auto;

    padding:20px;

}

.cards{

    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:20px;

    margin-top:20px;

}

.card{

    background:white;

    border-radius:12px;

    padding:25px;

    box-shadow:0 3px 10px rgba(0,0,0,.1);

}

.card-title{

    color:#666;

    font-size:18px;

}

.card-value{

    font-size:42px;

    font-weight:bold;

    margin-top:10px;

    color:#0d6efd;

}

.table-panel{

    margin-top:30px;

    background:white;

    border-radius:12px;

    padding:20px;

    box-shadow:0 3px 10px rgba(0,0,0,.1);

}

table{

    width:100%;

    border-collapse:collapse;

}

th,td{

    padding:12px;

    border-bottom:1px solid #ddd;

    text-align:left;

}

th{

    background:#0d6efd;

    color:white;

}

.badge{

    padding:6px 12px;

    border-radius:20px;

    color:white;

    font-size:12px;

    font-weight:bold;

}

.finished{

    background:#198754;

}

.skipped{

    background:#6c757d;

}

.waiting{

    background:#ffc107;

    color:#222;

}

.calling{

    background:#dc3545;

}

.serving{

    background:#0d6efd;

}

.footer{

    text-align:center;

    padding:20px;

    color:#888;

}

</style>

</head>

<body>

<div class="header">

    <h1>📈 AQMS Reporting</h1>

    <p id="clock"></p>

</div>

<div class="container">

    <div class="cards">

        <div class="card">

            <div class="card-title">

                👥 Total

            </div>

            <div id="total" class="card-value">

                0

            </div>

        </div>

        <div class="card">

            <div class="card-title">

                ✅ Finished

            </div>

            <div id="finished" class="card-value">

                0

            </div>

        </div>

        <div class="card">

            <div class="card-title">

                ⏭ Skipped

            </div>

            <div id="skipped" class="card-value">

                0

            </div>

        </div>

        <div class="card">

            <div class="card-title">

                ⏱ Avg Service

            </div>

            <div id="avgService" class="card-value">

                --

            </div>

        </div>

        <div class="card">

            <div class="card-title">

                🏆 Best Counter

            </div>

            <div id="bestCounter" class="card-value">

                --

            </div>

        </div>

        <div class="card">

            <div class="card-title">

                📊 Productivity

            </div>

            <div id="productivity" class="card-value">

                --

            </div>

        </div>

    </div>

    <div class="table-panel">

        <h2>📋 Detail Report</h2>

        <p>

            <table>

<thead>

<tr>

<th>No</th>

<th>Nomor</th>

<th>Counter</th>

<th>Status</th>

<th>Dipanggil</th>

<th>Selesai</th>

<th>Durasi</th>

</tr>

</thead>

        <tbody id="reportTable">

        <tr>

        <td colspan="7">

        Belum ada data.

        </td>

        </tr>

        </tbody>

        </table>

        </p>

    </div>

</div>

<div class="footer">

    AQMS Reporting Module v1.0

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="js/report.js"></script>

</body>

</html>
